name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Cài package
        run: flutter pub get

      - name: Kiểm tra file ngôn ngữ (vi/en đủ khoá, không trùng)
        run: python3 tool/l10n_merge.py --check

      - name: Sinh code đa ngôn ngữ
        run: flutter gen-l10n

      - name: Kiểm tra định dạng code
        run: dart format --output=none --set-exit-if-changed -l 120 lib test

      - name: Phân tích tĩnh
        run: flutter analyze

      - name: Chạy test
        run: flutter test --reporter expanded

  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: vietgig-apk
          path: build/app/outputs/flutter-apk/app-release.apk
